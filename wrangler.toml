name = "fast-bot"
main = "src/index.js"
compatibility_date = "2024-04-05"

# Free plan is plenty for a Telegram bot webhook.
# workers_dev = true

# Non-secret vars (safe to commit) go here, e.g.:
# [vars]
# ADMIN_IDS = "123456789,987654321"

# Secrets (BOT_TOKEN, TELEGRAM_SECRET) are NOT set here.
# Set them with:
#   wrangler secret put BOT_TOKEN
#   wrangler secret put TELEGRAM_SECRET

# Uncomment and create a KV namespace if you use src/models/User.js:
# [[kv_namespaces]]
# binding = "USERS_KV"
# id = "replace-with-namespace-id"
